services:
  products-api:
    build:
      context: .
      args:
        SERVICE: products-api
    environment:
      PRODUCTS_DATABASE_PATH: /data/products.db
    ports:
      - '3001:3001'
    volumes:
      - products-data:/data
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nbp-mock:
    build:
      context: .
      args:
        SERVICE: nbp-mock
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  orders-api:
    build:
      context: .
      args:
        SERVICE: orders-api
    environment:
      ORDERS_DATABASE_PATH: /data/orders.db
      PRODUCTS_BASE_URL: http://products-api:3001
      NBP_BASE_URL: http://nbp-mock:3003
    ports:
      - '3002:3002'
    volumes:
      - orders-data:/data
    depends_on:
      products-api:
        condition: service_healthy
      nbp-mock:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      FRONTEND_PRODUCTS_URL: http://products-api:3001
      FRONTEND_ORDERS_URL: http://orders-api:3002
    ports:
      - '5173:5173'
    depends_on:
      products-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
      nbp-mock:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  products-data:
  orders-data:
